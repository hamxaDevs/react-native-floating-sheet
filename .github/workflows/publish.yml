name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: yarn

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Show versions
        run: |
          node --version
          npm --version
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Validate release tag matches package version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v$PACKAGE_VERSION"

          echo "Release tag: $TAG_NAME"
          echo "Package version: $PACKAGE_VERSION"
          echo "Expected tag: $EXPECTED_TAG"

          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag does not match package.json version."
            echo "Expected $EXPECTED_TAG but got $TAG_NAME"
            exit 1
          fi

      - name: Check npm version does not already exist
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "react-native-floating-sheet@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "react-native-floating-sheet@$PACKAGE_VERSION already exists on npm."
            exit 1
          fi

      - name: Run lint
        run: yarn lint

      - name: Run typecheck
        run: yarn typecheck

      - name: Run tests
        run: yarn test

      - name: Build package
        run: yarn prepare

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
