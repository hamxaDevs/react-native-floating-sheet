name: PR Target

on:
  pull_request:
    branches:
      - main

jobs:
  validate-release-pr:
    name: Validate release PR target
    runs-on: ubuntu-latest

    steps:
      - name: Ensure only release branches target main
        run: |
          HEAD_BRANCH="${{ github.head_ref }}"

          echo "PR source branch: $HEAD_BRANCH"

          if ! echo "$HEAD_BRANCH" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Only release branches like v0.1.2 can be merged into main."
            echo "Open normal feature/fix PRs into dev instead."
            exit 1
          fi
